name: Build kernel (gtanotexllte)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-19.1
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio zip xz-utils python3 device-tree-compiler

      - name: Get toolchains (same clang as the ROM, r416183b)
        run: |
          git clone --depth 1 -b lineage-20.0 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b $HOME/clang
          git clone --depth 1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 $HOME/gcc
          $HOME/clang/bin/clang --version | head -1

      - name: Configure and build
        env:
          KBUILD_BUILD_USER: nobody
          KBUILD_BUILD_HOST: android-build
          KBUILD_BUILD_TIMESTAMP: "Wed Mar 12 03:14:05 GMT 2025"
        run: |
          export PATH=$HOME/clang/bin:$HOME/gcc/bin:$PATH
          export ARCH=arm64
          make O=out lineage-gtanotexllte_defconfig
          make -j$(nproc) O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- Image dtbs 2>&1 | tail -n 60

      - name: Report result
        run: |
          ls -l out/arch/arm64/boot/Image
          echo "Your ROM kernel Image is 21243264 bytes"
          strings out/arch/arm64/boot/Image | grep -m1 "Linux version"
          sha256sum out/arch/arm64/boot/Image

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gtanotexllte
          path: |
            out/arch/arm64/boot/Image
            out/.config
